global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: aegisflow-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['api:3001']

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: otel-exported-metrics
    static_configs:
      - targets: ['otel-collector:8889']
