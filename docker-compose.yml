name: aegisflow

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegisflow_db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-200520}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8.2.1-alpine
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:${PROXY_PORT:-8080}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-local-minio-password}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aegisflow_local}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-local-minio-password}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aegisflow_local}
      MINIO_BUCKET_EVIDENCE: ${MINIO_BUCKET_EVIDENCE:-aegisflow-evidence}
      MINIO_BUCKET_KNOWLEDGE: ${MINIO_BUCKET_KNOWLEDGE:-aegisflow-knowledge}
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        mc mb --ignore-existing "local/$${MINIO_BUCKET_EVIDENCE}";
        mc anonymous set none "local/$${MINIO_BUCKET_EVIDENCE}";
        mc mb --ignore-existing "local/$${MINIO_BUCKET_KNOWLEDGE}";
        mc anonymous set none "local/$${MINIO_BUCKET_KNOWLEDGE}"
    restart: 'no'
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    command: ['node', 'node_modules/prisma/build/index.js', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-200520}@postgres:5432/${POSTGRES_DB:-aegisflow_db}
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-deterministic}
      API_HOST: 0.0.0.0
      API_PORT: 3001
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-600}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-aegisflow-web}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:-ZGV2LW9ubHktYWVzLWtleS0zMi1ieXRlcy1sb25nISE=}
      AUTH_ISSUER: ${AUTH_ISSUER:-aegisflow-api}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-only-jwt-secret-change-before-production-2026}
      AUTH_TOKEN_PEPPER: ${AUTH_TOKEN_PEPPER:-dev-only-token-pepper-change-before-production-2026}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: http://localhost:${PROXY_PORT:-8080}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-200520}@postgres:5432/${POSTGRES_DB:-aegisflow_db}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-aegisflow_local}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-this-local-minio-password}
      MINIO_BUCKET_EVIDENCE: ${MINIO_BUCKET_EVIDENCE:-aegisflow-evidence}
      MINIO_BUCKET_KNOWLEDGE: ${MINIO_BUCKET_KNOWLEDGE:-aegisflow-knowledge}
      NODE_ENV: development
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:20b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: aegisflow-api
      REDIS_URL: redis://redis:6379
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/v1/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    init: true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-deterministic}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:-ZGV2LW9ubHktYWVzLWtleS0zMi1ieXRlcy1sb25nISE=}
      AUTH_TOKEN_PEPPER: ${AUTH_TOKEN_PEPPER:-dev-only-token-pepper-change-before-production-2026}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-200520}@postgres:5432/${POSTGRES_DB:-aegisflow_db}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-aegisflow_local}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-this-local-minio-password}
      MINIO_BUCKET_KNOWLEDGE: ${MINIO_BUCKET_KNOWLEDGE:-aegisflow-knowledge}
      NODE_ENV: development
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:20b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
      REDIS_URL: redis://redis:6379
      WORKER_METRICS_PORT: 9464
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    init: true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    environment:
      INTERNAL_API_BASE_URL: http://api:3001/api/v1
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.29.1-alpine
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - '${PROXY_PORT:-8080}:8080'
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    command: ['--config=/etc/otelcol-contrib/config.yml']
    volumes:
      - ./infrastructure/otel/collector-config.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - '${OTEL_GRPC_PORT:-4317}:4317'
      - '${OTEL_HTTP_PORT:-4318}:4318'
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-this-local-grafana-password}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '${GRAFANA_PORT:-3002}:3000'
    depends_on:
      - prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  event-simulator:
    profiles: ['demo']
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.event-simulator
    environment:
      EVENT_SIMULATOR_API_URL: http://api:3001/api/v1
      EVENT_SIMULATOR_API_KEY: ${EVENT_SIMULATOR_API_KEY:-}
      EVENT_SIMULATOR_CONNECTOR_ID: ${EVENT_SIMULATOR_CONNECTOR_ID:-}
      EVENT_SIMULATOR_COUNT: ${EVENT_SIMULATOR_COUNT:-10}
      EVENT_SIMULATOR_ORGANIZATION_ID: ${EVENT_SIMULATOR_ORGANIZATION_ID:-}
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    restart: 'no'
    security_opt:
      - no-new-privileges:true

volumes:
  grafana_data:
  minio_data:
  postgres_data:
  prometheus_data:
  redis_data:
